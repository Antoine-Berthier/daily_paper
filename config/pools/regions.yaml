# Régions du monde pour la rubrique Ailleurs (tirées en sac mélangé :
# toutes y passent avant qu'une revienne). Europe de l'Ouest et Amérique du
# Nord exclues volontairement.
- Afrique du Nord (Maroc, Algérie, Tunisie, Libye)
- Sahara et Sahel (Mauritanie, Mali, Niger, Tchad)
- Afrique de l'Ouest côtière (Sénégal, Guinée, Côte d'Ivoire, Ghana, Bénin)
- Nigeria et Cameroun
- Afrique centrale (Gabon, Congo, RDC, Centrafrique)
- Corne de l'Afrique (Éthiopie, Érythrée, Djibouti, Somalie)
- Afrique de l'Est (Kenya, Tanzanie, Ouganda, Rwanda, Burundi)
- Afrique australe (Namibie, Botswana, Zimbabwe, Mozambique, Lesotho)
- Madagascar et océan Indien (Maurice, Réunion, Comores, Seychelles)
- Levant (Liban, Syrie, Jordanie, Palestine)
- Péninsule arabique (Oman, Yémen, Arabie saoudite)
- Iran
- Caucase (Géorgie, Arménie, Azerbaïdjan)
- Anatolie et Turquie orientale
- Asie centrale (Ouzbékistan, Kirghizistan, Tadjikistan, Kazakhstan, Turkménistan)
- Mongolie
- Sibérie et Extrême-Orient russe
- Himalaya (Népal, Bhoutan, Ladakh, Tibet)
- Pakistan et Afghanistan
- Inde du Nord
- Inde du Sud
- Nord-Est indien et Bangladesh
- Sri Lanka et Maldives
- Chine de l'Ouest (Yunnan, Sichuan, Xinjiang, Gansu)
- Chine de l'Est et du Sud
- Corée
- Japon hors grandes villes
- Taïwan
- Asie du Sud-Est continentale (Vietnam, Laos, Cambodge, Thaïlande, Myanmar)
- Asie du Sud-Est insulaire (Indonésie, Philippines, Malaisie, Timor oriental)
- Papouasie et Mélanésie (Papouasie-Nouvelle-Guinée, Vanuatu, Salomon, Fidji)
- Polynésie et Micronésie
- Australie intérieure et terres aborigènes
- Nouvelle-Zélande / Aotearoa
- Mexique
- Amérique centrale (Guatemala, Belize, Honduras, Nicaragua, Costa Rica, Panama)
- Caraïbes (Cuba, Haïti, Jamaïque, Trinidad, petites Antilles)
- Andes du Nord (Colombie, Équateur, Venezuela)
- Andes centrales (Pérou, Bolivie)
- Amazonie
- Brésil hors Amazonie
- Cône Sud (Chili, Argentine, Uruguay, Paraguay)
