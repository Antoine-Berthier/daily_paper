# Angles d'écriture tirés au hasard (façon Oblique Strategies) pour varier la
# forme autant que le fond.
- raconte-le à travers un objet emblématique
- raconte-le à travers une personne réelle (citée par une source)
- commence par un chiffre surprenant
- commence par une scène au présent
- l'histoire en trois dates
- ce que les gens sur place en disent (citations sourcées)
- la question qu'on se pose tous, et sa réponse
- un malentendu courant à démonter
- le petit détail que presque personne ne remarque
- un contraste avec la Belgique
- comme un guide pour une première fois
- par les sens (ce qu'on entend, sent, goûte)
